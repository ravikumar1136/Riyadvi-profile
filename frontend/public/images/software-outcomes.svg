<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" fill="none">
  <defs>
    <linearGradient id="background" x1="800" y1="0" x2="800" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F7F3"/>
